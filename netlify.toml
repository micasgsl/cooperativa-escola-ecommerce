[build]
  command = "pnpm build"
  functions = "dist"
  publish = "dist/client"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "drizzle-orm"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
